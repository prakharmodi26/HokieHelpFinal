[project]
name = "hokiehelp-crawler"
version = "0.1.0"
description = "VT-wide web crawler that stores Markdown in MinIO"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai>=0.6.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    # Lean line (<0.1): pymupdf-only. Newer pymupdf4llm (1.x) hard-pins
    # pymupdf_layout -> onnxruntime (a runtime-downloaded ML layout model),
    # which we avoid for image size — classic to_markdown already yields
    # table/heading markdown at near-zero footprint.
    "pymupdf4llm>=0.0.17,<0.1",
    "python-docx>=1.1.0",
    "mammoth>=1.8.0",
    "markdownify>=0.13.0",
    "tldextract>=5.1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "puremagic>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
hokiehelp-crawl = "crawler.main:cli"
