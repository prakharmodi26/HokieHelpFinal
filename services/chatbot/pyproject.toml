[project]
name = "hokiehelp-chatbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.7.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "live: hits live VT endpoints (deselected by default; run with -m live)",
]
addopts = "-m \"not live\""
