apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: test
  labels:
    app: hokiehelp-pipeline
data:
  # Default crawl settings for scheduled runs. The production crawler is
  # registry-seeded; CRAWL_SEED_URL is retained only for legacy CLI overrides.
  CRAWL_SEED_URL: "https://vt.edu"
  CRAWL_ALLOWED_DOMAINS: "vt.edu"
  CRAWL_MAX_DEPTH: "10"
  CRAWL_MAX_PAGES: "9999999"
  # Pipeline behavior
  PIPELINE_NAMESPACE: "test"
  PIPELINE_POLL_INTERVAL: "30"
